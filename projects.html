<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find Projects - MPLADS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Custom Hover & Active Tab Styling */
    .tab-btn {
      transition: all 0.2s ease-in-out;
    }
    .tab-btn.active {
      border-bottom-color: #2563eb;
      color: #2563eb;
      background-color: #eff6ff;
    }
    .card-hover {
      transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
    }
    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 sm:p-6 lg:p-8 font-sans antialiased text-slate-800">

  <div class="max-w-7xl mx-auto">
    
    <header class="mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 tracking-tight">Find Projects</h1>
      <p class="text-sm sm:text-base text-slate-500 mt-1">
        Explore, filter, and track real-time status of MPLADS civil records
      </p>
    </header>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-6 mb-6">
      <div class="relative mb-4">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">🔍</span>
        <input
          type="text"
          id="searchInput"
          placeholder="Search projects..."
          value="Road Development"
          class="w-full pl-10 pr-4 py-2.5 bg-slate-50 hover:bg-slate-100/80 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all text-slate-700"
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">State / UT</label>
          <select id="stateSelect" class="w-full bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg p-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors cursor-pointer">
            <option value="">All States & UTs</option>
            <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
            <option value="Andhra Pradesh">Andhra Pradesh</option>
            <option value="Arunachal Pradesh">Arunachal Pradesh</option>
            <option value="Assam">Assam</option>
            <option value="Bihar">Bihar</option>
            <option value="Chandigarh">Chandigarh</option>
            <option value="Chhattisgarh">Chhattisgarh</option>
            <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option>
            <option value="Delhi">Delhi</option>
            <option value="Goa">Goa</option>
            <option value="Gujarat">Gujarat</option>
            <option value="Haryana">Haryana</option>
            <option value="Himachal Pradesh">Himachal Pradesh</option>
            <option value="Jammu and Kashmir">Jammu and Kashmir</option>
            <option value="Jharkhand">Jharkhand</option>
            <option value="Karnataka" selected>Karnataka</option>
            <option value="Kerala">Kerala</option>
            <option value="Ladakh">Ladakh</option>
            <option value="Lakshadweep">Lakshadweep</option>
            <option value="Madhya Pradesh">Madhya Pradesh</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Manipur">Manipur</option>
            <option value="Meghalaya">Meghalaya</option>
            <option value="Mizoram">Mizoram</option>
            <option value="Nagaland">Nagaland</option>
            <option value="Odisha">Odisha</option>
            <option value="Puducherry">Puducherry</option>
            <option value="Punjab">Punjab</option>
            <option value="Rajasthan">Rajasthan</option>
            <option value="Sikkim">Sikkim</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Telangana">Telangana</option>
            <option value="Tripura">Tripura</option>
            <option value="Uttar Pradesh">Uttar Pradesh</option>
            <option value="Uttarakhand">Uttarakhand</option>
            <option value="West Bengal">West Bengal</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Constituency</label>
          <select class="w-full bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg p-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors cursor-pointer">
            <option>Bangalore South</option>
            <option>Patna Sahib</option>
            <option>Bhagalpur</option>
            <option>Mumbai North</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Status</label>
          <select class="w-full bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg p-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors cursor-pointer">
            <option>All Status</option>
            <option>Ongoing</option>
            <option>Completed</option>
            <option>Delayed</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Category</label>
          <select class="w-full bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg p-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors cursor-pointer">
            <option>All Types</option>
            <option>Civil Infrastructure</option>
            <option>Community Dev</option>
            <option>Water & Sanitation</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Fin. Year</label>
          <select class="w-full bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg p-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors cursor-pointer">
            <option>2025</option>
            <option>2024</option>
            <option>2023</option>
          </select>
        </div>
      </div>

      <div class="mt-3 text-xs text-blue-600 font-medium flex items-center gap-1">
        <span class="h-1.5 w-1.5 rounded-full bg-blue-600 inline-block"></span>
        Applied Filters: KA / BLR-S / FY25
      </div>
    </div>

    <div class="flex border-b border-slate-200 mb-6 overflow-x-auto gap-1">
      <button onclick="filterTab('All')" id="tab-All" class="tab-btn active py-2.5 px-4 text-sm font-semibold whitespace-nowrap border-b-2 border-transparent text-slate-500 hover:text-blue-600 hover:bg-slate-100 rounded-t-lg cursor-pointer">
        All (<span id="count-All">0</span>)
      </button>
      <button onclick="filterTab('Ongoing')" id="tab-Ongoing" class="tab-btn py-2.5 px-4 text-sm font-semibold whitespace-nowrap border-b-2 border-transparent text-slate-500 hover:text-blue-600 hover:bg-slate-100 rounded-t-lg cursor-pointer">
        Ongoing (<span id="count-Ongoing">0</span>)
      </button>
      <button onclick="filterTab('Completed')" id="tab-Completed" class="tab-btn py-2.5 px-4 text-sm font-semibold whitespace-nowrap border-b-2 border-transparent text-slate-500 hover:text-blue-600 hover:bg-slate-100 rounded-t-lg cursor-pointer">
        Completed (<span id="count-Completed">0</span>)
      </button>
      <button onclick="filterTab('Delayed')" id="tab-Delayed" class="tab-btn py-2.5 px-4 text-sm font-semibold whitespace-nowrap border-b-2 border-transparent text-slate-500 hover:text-blue-600 hover:bg-slate-100 rounded-t-lg cursor-pointer">
        Delayed (<span id="count-Delayed">0</span>)
      </button>
    </div>

    <div id="projectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      </div>

  </div>

  <script>
    // Sample Data
    const projectsData = [
      {
        id: 1,
        category: 'CIVIL INFRASTRUCTURE',
        status: 'Ongoing',
        statusBadge: 'Under Execution',
        title: 'Road Development – Ward 12',
        location: 'South District, Bangalore • PWD Sub-Division 4',
        progress: 48,
        sanctioned: '₹48.50 L',
        spent: '₹21.20 L',
        utilization: '64.3%',
        riskTag: 'High Delay Risk',
        riskClass: 'text-red-600 bg-red-50 hover:bg-red-100',
        badgeClass: 'bg-teal-100 text-teal-700'
      },
      {
        id: 2,
        category: 'COMMUNITY DEV',
        status: 'Ongoing',
        statusBadge: 'Near Completion',
        title: 'Community Hall Construction',
        location: 'North District, Hebbal • Zilla Panchayat Agency',
        progress: 72,
        sanctioned: '₹32.00 L',
        spent: '₹18.40 L',
        utilization: '57.5%',
        riskTag: 'On Schedule',
        riskClass: 'text-teal-600 bg-teal-50 hover:bg-teal-100',
        badgeClass: 'bg-teal-100 text-teal-700'
      },
      {
        id: 3,
        category: 'WATER & SANITATION',
        status: 'Delayed',
        statusBadge: 'Delayed',
        title: 'Drinking Water Facility',
        location: 'East District, KR Puram • Rural Water Supply',
        progress: 35,
        sanctioned: '₹26.50 L',
        spent: '₹21.80 L',
        utilization: '82.2%',
        riskTag: 'Medium Vendor Lag',
        riskClass: 'text-amber-600 bg-amber-50 hover:bg-amber-100',
        badgeClass: 'bg-red-100 text-red-700'
      },
      {
        id: 4,
        category: 'CIVIL INFRASTRUCTURE',
        status: 'Completed',
        statusBadge: 'Completed',
        title: 'Primary Health Centre Renovation',
        location: 'West District, Vijayanagar • Health Dept',
        progress: 100,
        sanctioned: '₹15.00 L',
        spent: '₹14.80 L',
        utilization: '98.6%',
        riskTag: 'Completed On Time',
        riskClass: 'text-green-600 bg-green-50 hover:bg-green-100',
        badgeClass: 'bg-green-100 text-green-700'
      }
    ];

    let currentTab = 'All';

    // Render Cards Function with Hover Effects
    function renderProjects(filterStatus = 'All') {
      const container = document.getElementById('projectsGrid');
      container.innerHTML = '';

      const filtered = projectsData.filter(p => filterStatus === 'All' || p.status === filterStatus);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full bg-white p-10 rounded-xl border border-dashed border-slate-300 text-center text-slate-500">
            Is category ke liye abhi koi project data uplabdh nahi hai.
          </div>
        `;
        return;
      }

      filtered.forEach(project => {
        const cardHtml = `
          <div class="card-hover bg-white rounded-xl border border-slate-200 p-5 shadow-sm flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-center text-xs font-semibold mb-3">
                <span class="text-slate-400 tracking-wider uppercase">${project.category}</span>
                <span class="px-2.5 py-0.5 rounded-full ${project.badgeClass}">• ${project.statusBadge}</span>
              </div>

              <h3 class="text-base font-bold text-slate-800 mb-1 hover:text-blue-600 transition-colors cursor-pointer">${project.title}</h3>
              <p class="text-xs text-slate-500 mb-4 flex items-start gap-1">
                <span>📍</span> ${project.location}
              </p>

              <div class="mb-5">
                <div class="flex justify-between text-xs font-semibold mb-1">
                  <span class="text-slate-600">Physical Work Execution</span>
                  <span class="text-blue-600 font-bold">${project.progress}%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                  <div class="h-2 rounded-full transition-all duration-500 ${project.progress === 100 ? 'bg-green-500' : 'bg-teal-500'}" style="width: ${project.progress}%"></div>
                </div>
              </div>

              <div class="grid grid-cols-3 gap-2 bg-slate-50 p-3 rounded-lg text-center mb-4 border border-slate-100">
                <div>
                  <div class="text-[10px] text-slate-400 uppercase font-semibold">Sanctioned</div>
                  <div class="text-xs font-bold text-slate-700">${project.sanctioned}</div>
                </div>
                <div>
                  <div class="text-[10px] text-slate-400 uppercase font-semibold">Spent</div>
                  <div class="text-xs font-bold text-slate-700">${project.spent}</div>
                </div>
                <div>
                  <div class="text-[10px] text-slate-400 uppercase font-semibold">Utilization</div>
                  <div class="text-xs font-bold text-slate-700">${project.utilization}</div>
                </div>
              </div>
            </div>

            <div class="flex justify-between items-center pt-3 border-t border-slate-100 text-xs">
              <span class="font-semibold px-2 py-1 rounded transition-colors ${project.riskClass}">🚨 ${project.riskTag}</span>
              <button class="text-slate-600 hover:text-blue-600 hover:underline font-medium transition-colors cursor-pointer flex items-center gap-1 group">
                View Project <span class="group-hover:translate-x-1 transition-transform inline-block">→</span>
              </button>
            </div>
          </div>
        `;
        container.innerHTML += cardHtml;
      });
    }

    // Update Dynamic Tab Counts
    function updateCounts() {
      document.getElementById('count-All').innerText = projectsData.length;
      document.getElementById('count-Ongoing').innerText = projectsData.filter(p => p.status === 'Ongoing').length;
      document.getElementById('count-Completed').innerText = projectsData.filter(p => p.status === 'Completed').length;
      document.getElementById('count-Delayed').innerText = projectsData.filter(p => p.status === 'Delayed').length;
    }

    // Tab Filter Trigger
    function filterTab(status) {
      currentTab = status;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${status}`).classList.add('active');
      renderProjects(status);
    }

    // Page Load Setup
    window.onload = () => {
      updateCounts();
      renderProjects('All');
    };
  </script>
</body>
</html>
